services:
  # Nuestro backend de Telefonista IA
  telefonista-backend:
    build: .
    container_name: telefonista_ia_app
    restart: always
    ports:
      - "8089:8000"
    env_file:
      - .env
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-credentials.json
    volumes:
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
    networks:
      - telefonista_net

networks:
  telefonista_net:
    driver: bridge
